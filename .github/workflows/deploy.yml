name: Automated Frontend Deployment

on:
  push:
    branches:
      - main  # Change this if your primary branch is called master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying via SSH
        uses: appleboy/ssh-action@master
        with:
          host: "trayakshconstruction.com"
          username: "root"                  # Or your cPanel user if configured for SSH
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22                          # Change if your VPS uses a custom SSH port
          script: |
            cd /home/trayaksh/frontend
            
            echo "Pulling latest code from GitHub..."
            git pull origin main
            
            echo "Installing dependencies..."
            npm install
            
            echo "Building the application..."
            npm run build
            
            echo "Restarting Next.js process in PM2..."
            pm2 restart trayaksh-frontend
            
            echo "Deployment finished successfully!"